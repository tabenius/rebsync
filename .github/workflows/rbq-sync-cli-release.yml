name: rbq-sync CLI release
# Tag rbq-sync-vX.Y.Z to attach static Linux x86_64/aarch64 tarballs to a
# candidate release. The same script runs locally when CI is unavailable:
#   scripts/build-cli-release.sh dist/cli
on:
  push:
    tags: ["rbq-sync-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: Build
        run: scripts/build-cli-release.sh dist/cli
      - name: Publish candidate release
        if: startsWith(github.ref, 'refs/tags/rbq-sync-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/cli/* --prerelease \
            --title "rbq-sync ${GITHUB_REF_NAME#rbq-sync-v} (Linux CLI)" \
            --notes "Static Linux x86_64 and aarch64 builds (Chromebook/Crostini). Verify with SHA256SUMS."
