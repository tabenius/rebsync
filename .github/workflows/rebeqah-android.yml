name: Rebeqah Android release
# Builds the signed universal APK. Push a tag `vX.Y.Z` to publish a
# GitHub candidate release. New releases use vX.Y.Z for registry compatibility.
#
# Required repository secrets (never commit the keystore):
#   RBQ_KEYSTORE_B64   base64 of the .jks file
#   RBQ_STORE_PASSWORD
#   RBQ_KEY_PASSWORD
#   RBQ_KEY_ALIAS      (optional, defaults to "rbq")
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an immutable app release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/rebsync-app/src-tauri/tauri.conf.json)"
          test "$GITHUB_REF" = "refs/tags/v$version" || { echo 'Dispatch on the app version tag, not a branch'; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/v$version^{commit}")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it'; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Android SDK packages
        run: |
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" > /dev/null
      - name: Test shared app logic and release metadata refusals
        run: |
          cargo test --manifest-path apps/rebsync-app/logic-tests/Cargo.toml
          python3 scripts/test_android_release.py
      - name: Signing keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.RBQ_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::RBQ_KEYSTORE_B64 secret is not set"; exit 1; }
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rbq-release.jks"
      - name: Build release APK
        working-directory: apps/rebsync-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          RBQ_STORE_FILE: ${{ runner.temp }}/rbq-release.jks
          RBQ_STORE_PASSWORD: ${{ secrets.RBQ_STORE_PASSWORD }}
          RBQ_KEY_PASSWORD: ${{ secrets.RBQ_KEY_PASSWORD }}
          RBQ_KEY_ALIAS: ${{ secrets.RBQ_KEY_ALIAS || 'rbq' }}
        run: |
          npm ci
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: Verify signature and collect
        run: |
          set -euo pipefail
          apk=apps/rebsync-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          python3 scripts/prepare_android_release.py --apk "$apk" --dist dist \
            --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" \
            --aapt "$ANDROID_HOME/build-tools/37.0.0/aapt"
      - name: Remove temporary keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/rbq-release.jks"
      - uses: sigstore/cosign-installer@v3
      - name: Sign exact candidate inventory using tag-bound CI identity
        run: cosign sign-blob --yes --bundle dist/release.sigstore.json dist/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: rebeqah-apk
          path: dist/*
      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease \
            --title "RAGBAZ Rebeqah ${GITHUB_REF_NAME#v} (Android candidate)" \
            --notes "Signed universal APK (arm64, armv7, x86_64; Android 7+). Candidate: installation on a physical device has not been verified. See android.json for the package/versionCode/signing identity and release.json plus release.sigstore.json for CI verification."
