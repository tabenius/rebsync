name: Rebeqah Android release
# Thin wrapper: every step is scripts/release-android.sh, which also runs on a
# laptop, a self-hosted runner or another CI. Push a tag `vX.Y.Z` (matching the
# app version) to publish a GitHub candidate release.
#
# Required secrets (never commit the keystore):
#   RBQ_KEYSTORE_B64   base64 of the .jks file
#   RBQ_STORE_PASSWORD
#   RBQ_KEY_PASSWORD
#   RBQ_KEY_ALIAS      (optional, defaults to "rbq")
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse an existing release early
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=release-android publish::release $RELEASE_TAG already exists — fix: releases are immutable; bump the version and tag a new one"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Android SDK packages
        run: scripts/release-android.sh install-sdk
      - name: Signing keystore from secrets
        env:
          RBQ_KEYSTORE_B64: ${{ secrets.RBQ_KEYSTORE_B64 }}
        run: echo "RBQ_STORE_FILE=$(scripts/release-android.sh keystore-from-env)" >> "$GITHUB_ENV"
      - name: Preflight (lists every problem with its fix)
        env:
          RBQ_STORE_PASSWORD: ${{ secrets.RBQ_STORE_PASSWORD }}
          RBQ_KEY_ALIAS: ${{ secrets.RBQ_KEY_ALIAS || 'rbq' }}
        run: scripts/release-android.sh doctor
      - name: Build release APK
        env:
          RBQ_STORE_PASSWORD: ${{ secrets.RBQ_STORE_PASSWORD }}
          RBQ_KEY_PASSWORD: ${{ secrets.RBQ_KEY_PASSWORD }}
          RBQ_KEY_ALIAS: ${{ secrets.RBQ_KEY_ALIAS || 'rbq' }}
        run: scripts/release-android.sh build
      - name: Remove temporary keystore
        if: always()
        run: rm -f "${RBQ_STORE_FILE:-/nonexistent}"
      - name: Verify signature and collect
        run: scripts/release-android.sh collect
      - uses: sigstore/cosign-installer@v3
      - name: Sign exact candidate inventory using tag-bound CI identity
        env:
          RBQ_REQUIRE_SIGSTORE: "1"
        run: scripts/release-android.sh sign-inventory
      - name: Keep a copy as a workflow artifact (best effort)
        # Artifact storage quotas must not block a release: the GitHub release
        # below carries the same files.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rebeqah-apk
          path: dist/*
      - name: Publish candidate release
        run: scripts/release-android.sh publish
