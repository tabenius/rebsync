name: Rust
on: [push, pull_request]
jobs:
  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: tabenius/ragbaz-common
          ref: f6f44e27ae7051968897080faf820c8ad6475147
          path: .component-schema
          persist-credentials: false
      - run: python -m pip install jsonschema==4.23.0
      - run: python scripts/validate_component.py --schema .component-schema/schemas/ragbaz.component.schema.json
      - run: python scripts/test_component.py --schema .component-schema/schemas/ragbaz.component.schema.json
      - run: python scripts/test_android_release.py
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install restore-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p rebsync-core --features storage-object-store --locked
      - run: cargo check -p rebsync-cli --no-default-features --locked
      - name: Rebekah app logic (no Tauri/GTK needed)
        run: cargo test --manifest-path apps/rebsync-app/logic-tests/Cargo.toml
