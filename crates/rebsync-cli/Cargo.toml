[package]
name = "rebsync-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["storage", "peer", "serve", "secret-service", "term"]
storage = ["rebsync-core/storage-object-store"]
peer = ["storage", "rebsync-core/peer-http", "rebsync-core/peer-transport", "rebsync-core/peer-quic"]
serve = ["storage", "rebsync-core/serve"]
term = ["rebsync-core/term"]
# Seal Dash credentials with a key in the desktop Secret Service (Linux).
secret-service = ["rebsync-core/secret-service"]

[[bin]]
name = "rbq"
path = "src/main.rs"

# The olden name, kept so existing scripts, timers and muscle memory work.
[[bin]]
name = "rebsync"
path = "src/rebsync.rs"

[dependencies]
rebsync-core = { path = "../rebsync-core", default-features = false }
anyhow.workspace = true
serde_json.workspace = true
tempfile.workspace = true
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

[target.'cfg(unix)'.dependencies]
# Clean shutdown of `rbq peer serve` under systemd and other supervisors.
signal-hook = "0.3"
