[package]
name = "rebsync-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["storage", "peer"]
storage = ["rebsync-core/storage-object-store"]
peer = ["storage", "rebsync-core/peer-http", "rebsync-core/peer-transport"]

[[bin]]
name = "rebsync"
path = "src/main.rs"

[dependencies]
rebsync-core = { path = "../rebsync-core", default-features = false }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
