[package]
name = "rebsync-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
storage-object-store = ["dep:object_store", "dep:futures", "dep:tokio"]
peer-http = ["dep:ureq"]
peer-transport = ["storage-object-store"]
serve = ["dep:tiny_http", "dep:rcgen", "dep:mdns-sd"]
unit-core = ["dep:ragbaz-unit-core"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml = "0.8"
serde-saphyr = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
walkdir = "2"
wait-timeout = "0.2"
fs2 = "0.4"
sha2 = "0.10"
object_store = { version = "0.14.2", default-features = false, features = ["fs"], optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
tiny_http = { version = "0.12", features = ["ssl-rustls"], optional = true }
rcgen = { version = "0.14", optional = true }
mdns-sd = { version = "0.21", optional = true }
ragbaz-unit-core = { path = "../../../ragbaz-unit-core", optional = true, features = ["inbox"] }
