# All paths below are relative to rbq_home unless absolute.
version = 1
command_timeout_seconds = 120

[scan]
roots = ["src/ragbaz"]
max_depth = 14

[git]
remote_prefixes = ["github.com/tabenius", "github.com/RAGBAZ"]
fetch = true
push = true
fast_forward = true
backup_required = true

[backup]
# Initialize explicitly with: rbq backup-init --confirm --config PATH
# repository = "s3:https://ACCOUNT_ID.r2.cloudflarestorage.com/PRIVATE_BUCKET/rbq"
# password_file = "/path/outside/repositories/rbq-restic-password"
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY come from the environment.
# Never place credentials or the restic password in this file.

# Back up quiescent owner-produced exports, not a live SQLite directory.
# [[backup.datasets]]
# name = "frog-export"
# path = "reports/frog-export"
# kind = "directory"

[storage]
# Rebeqah-managed objects, not a source checkout or the restic repository.
# Relative paths resolve against rbq_home. Override with --storage-root.
root = ".rbq/objects"

[term]
# Browser operator terminal over the mesh (rbq term serve). Empty = nobody.
operators = []          # e.g. ["tailscale:you@github", "netbird:laptop.netbird.cloud"]
hostnames = []          # extra Host names, e.g. MagicDNS
# shell = "/bin/bash"

[binaries]
# Self-built executables worth re-fetching instead of rebuilding.
enabled = false
label = "local"
chunk_bytes = 1048576
# repository = "s3:https://ACCOUNT_ID.r2.cloudflarestorage.com/PRIVATE_BUCKET/rbq-binaries"
# password_file = "/path/outside/repositories/rbq-binaries-password"
restic = true             # mirror verified objects under the private rbq-binaries tag
timeout_seconds = 900
# [[binaries.specs]]
# tool = "rbq"
# version = "0.1.0"
# path = "/home/xyzzy/.cargo/bin/rbq"
# target = "x86_64-unknown-linux-gnu"
# source = "src/ragbaz/rebsync"
# build_command = "cargo build --release -p rebsync-cli --locked"
# install_path = "/usr/local/bin/rbq"
# note = "self-built; private artifact name is never published publicly"

[mneme]
# Owner-exported Mneme index snapshots, published as content-addressed chunks.
enabled = false
binary = "mneme"
# db = "/private/path/mneme/index.sqlite"
label = "local"
# Multiple of 4096: page-aligned chunks dedup across snapshots.
chunk_bytes = 65536
# Also encrypt the verified export through restic (needs backup.repository).
restic = true
timeout_seconds = 900

[frog]
# Frog's AGENTS.db via `frog snapshot`, validated read-only before publication.
enabled = false
binary = "frog"
# db = "/data/src/AGENTS.db"
python = "python3"
label = "local"
chunk_bytes = 65536
restic = true
timeout_seconds = 600

[agenda]
# Daily Agenda editions, verified against their own manifest.json.
enabled = false
path = "/srv/ragbaz/reports/daily-agenda"
label = "local"
chunk_bytes = 65536
restic = true
require_ready = true

[git_layer]
# Committed history as Git bundles for offline exchange via the phone.
enabled = false
chunk_bytes = 65536
skip_unchanged = true
include_local_only = true
full_every = 20

[reconcile]
write_instructions = true

[fleet]
host = "kali-1"
root = "/srv/ragbaz/src/vendors/ragbaz/head"
