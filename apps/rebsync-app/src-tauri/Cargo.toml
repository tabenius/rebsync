[package]
name = "rebsync-app"
version = "0.2.7"
description = "RAGBAZ Rebeqah: Android companion for the rbq preservation core"
authors = ["rbq contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/tabenius/rebsync"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "rebsync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
rebsync-core = { path = "../../../crates/rebsync-core", default-features = false, features = ["storage-object-store", "peer-quic"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
walkdir = "2"
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# tiny_http 0.12.0 with its rustls backend ported to rustls 0.23; upstream has
# no release off rustls 0.20 (see vendor/tiny_http/README.md).
[patch.crates-io]
tiny_http = { path = "../../../vendor/tiny_http" }
