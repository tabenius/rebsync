[package]
name = "rebeqah-logic-tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rebsync-core = { path = "../../../crates/rebsync-core", features = ["storage-object-store", "peer-http", "peer-quic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
getrandom = "0.3"
walkdir = "2"
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
