[package]
name = "rebekah-logic-tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rebsync-core = { path = "../../../crates/rebsync-core", features = ["storage-object-store", "peer-http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.3"
walkdir = "2"
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
