[workspace]
members = ["crates/rebsync-core", "crates/rebsync-cli"]
exclude = ["apps/rebsync-app/src-tauri", "apps/rebsync-app/logic-tests"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tabenius/rebsync"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
# Release binaries are archived for re-fetch; debug symbols dominate their size.
# Keep them out of the published artifact (measured ~117M -> ~18M stripped).
strip = "symbols"
