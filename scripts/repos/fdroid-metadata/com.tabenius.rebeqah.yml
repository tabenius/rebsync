Name: Rebeqah
Summary: Keep your work safe and move it between devices without the internet
Description: |-
  Rebeqah (rbq) preserves work and exchanges Git repositories between
  machines over USB, SD cards, a local network or this phone, and reports
  what would be lost if a device failed. It shows connection strings,
  connected clients and free space, and can move data to an SD card or USB
  stick.
