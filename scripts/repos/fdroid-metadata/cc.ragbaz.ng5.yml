Name: BAZ NG-5
Summary: Healthy noise generator synth for sleep, rest and focus
Description: |-
  BAZ NG-5, model MÍMISBRUNR, is a healthy noise generator: a noise synth for
  sleep, rest and focus, in the spirit of 1970s synths and the TR-909 era, with a
  cobalt panel and orange keys.

  White, pink, brown, blue and violet voices ring-modulate and convolve each other
  over a slow breathing tide. An optional delta-band pulse steps down from alpha
  towards delta, and a sleep timer fades everything out.

  * masking noise in five colours, each with level, tone, pan and a breathing swell
  * a slow breathing guide, six breaths a minute by default
  * sleep timer with a gentle fade, and a dark DUSK screen for the bedroom
  * BAKE TAPE renders a seamless loop that keeps playing, and fading, with the screen locked
  * nine colour themes, three of them for colour vision differences
  * patches as links or JSON, and a night log with quick ratings

  Local-first: no account, no ads, no tracking. It works offline and keeps your
  settings, patches and night log on the device. Free and open source.

  Evidence for brainwave entrainment is mixed; the masking noise and slow
  breathing are the sturdier parts.
