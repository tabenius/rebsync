Name: BAZ NG-5
Summary: Local-first noise machine for sleep
Description: |-
  BAZ NG-5, model MÍMISBRUNR, is a noise instrument in the spirit of 1970s synths
  and the TR-909 era. White, pink, brown, blue and violet voices ring-modulate and
  convolve each other over a slow breathing tide, with an optional delta-band pulse
  and a sleep timer that fades out.

  Nine colour themes include three for colour vision differences. Everything stays
  on the device: no accounts, no analytics, settings in local storage only.
